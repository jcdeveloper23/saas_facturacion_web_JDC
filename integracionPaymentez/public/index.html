<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Agregar tarjeta de crédito</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font: Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />

  <!-- jQuery -->

  <!-- PG JS SDK -->
  <script src="https://cdn.paymentez.com/ccapi/sdk/payment_sdk_stable.min.js" charset="UTF-8"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.2.7/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.2.7/firebase-firestore.js"></script>
  <link href="./style.css" rel="stylesheet" />


</head>

<body>
  <div id='payment_example_divs'>
    <h1>Agregar tarjeta</h1>
    <div id='tokenize_example'></div>
    <div id="response"></div>
    <button id='tokenize_btn' class='tok_btn'>Guardar tarjeta</button>
    <button id='retry_btn' class='tok_btn' style='display: none;'>Guardar nueva tarjeta</button>
    <p>V1</p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDhucc6IYvGaOBDFp_sTAm92CYMIGJ308U",
      authDomain: "tubarpay.firebaseapp.com",
      projectId: "tubarpay",
      storageBucket: "tubarpay.firebasestorage.app",
      messagingSenderId: "1023644808997",
      appId: "1:1023644808997:web:30349d87df80824a024ccc",
      measurementId: "G-FJRD7XL844"
    };

    firebase.initializeApp(firebaseConfig);
    const firestore = firebase.firestore();

    (function () {
      let environment = 'stg'; // o 'prod'
      let application_code = 'TESTECUADORSTG-EC-CLIENT';
      let application_key = 'd4pUmVHgVpw2mJ66rWwtfWaO2bAWV6';
      let submitButton = document.querySelector('#tokenize_btn');
      let retryButton = document.querySelector('#retry_btn');
      let submitInitialText = submitButton.textContent;

      let get_tokenize_data = () => {
        return {
          locale: 'es',
          user: {
            id: 4,// String(Math.floor((new Date).getTime() / 1000)),
            email: 'pedro@gmail.com.com',
          },
          configuration: {
            default_country: 'EC'
          },
        };
      };

      let notCompletedFormCallback = message => {
        document.getElementById('response').innerHTML = `Formulario incompleto: ${message}`;
        submitButton.innerText = submitInitialText;
        submitButton.removeAttribute('disabled');
      };

      // Executed when was called 'tokenize' and the services response successfully.
    let responseCallback = response => {
      // Example of success tokenization.
      //   {
      //    "card": {
      //     "bin": "411111",
      //     "status": "valid",
      //     "token": "2508629432271853872",
      //     "message": "",
      //     "expiry_year": "2033",
      //     "expiry_month": "12",
      //     "transaction_reference": "RB-143809",
      //     "type": "vi",
      //     "number": "1111"
      //   }
      // }

      // Example of failed tokenization. The error format is always the same, only the value of type, help, description changes.
      // {
      //    "error": {
      //       "type": "Card already added: 2508629432271853872",
      //       "help": "If you want to update the card, first delete it",
      //       "description": "{}"
      //    }
      // }
      document.getElementById('response').innerHTML = JSON.stringify(response);
      retryButton.style.display = 'block';
      submitButton.style.display = 'none';
    }

      let pg_sdk = new PaymentGateway(environment, application_code, application_key);
      pg_sdk.generate_tokenize(get_tokenize_data(), '#tokenize_example', responseCallback, notCompletedFormCallback);

      submitButton.addEventListener('click', event => {
        document.getElementById('response').innerHTML = '';
        submitButton.innerText = 'Procesando...';
        submitButton.setAttribute('disabled', 'disabled');
        pg_sdk.tokenize();
        event.preventDefault();
      });

      retryButton.addEventListener('click', event => {
        submitButton.innerText = submitInitialText;
        submitButton.removeAttribute('disabled');
        retryButton.style.display = 'none';
        submitButton.style.display = 'block';
        pg_sdk.generate_tokenize(get_tokenize_data(), '#tokenize_example', responseCallback, notCompletedFormCallback);
      });
    })();
  </script>
</body>

</html>
