  # ────────────────────────────────────────────────────────────────────────────────
  # ACCOUNTING
  # ────────────────────────────────────────────────────────────────────────────────
  /closeAccountingPeriod:
    post:
      tags: [Accounting]
      summary: "Cerrar un período contable y generar el asiento de cierre"
      description: |
        Agrega todos los asientos `status='posted'` del período, identifica las cuentas
        de ingresos (grupo 4) y gastos (grupo 5), y crea el asiento de cierre que salda
        estas cuentas contra Utilidad/Pérdida del ejercicio (cuentas 3.3.02.001 / 3.3.02.002).

        El período se actualiza a `status: 'closed'`. Si el período no tiene movimientos,
        cierra sin asiento de cierre.

        **Validaciones:**
        - El período debe existir y tener `status: 'open'`.
        - El asiento de cierre debe cuadrar (débito = crédito). Si no cuadra, devuelve INTERNAL.

        **Efectos secundarios:** crea `companies/{companyId}/journal_entries/{entryId}`,
        actualiza `companies/{companyId}/accounting_periods/{periodId}`.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/CloseAccountingPeriodRequest'
      responses:
        '200':
          description: Período cerrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/CloseAccountingPeriodResponse'
        '400':
          description: Argumento inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '404':
          description: Período no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '428':
          description: El período no está abierto (FAILED_PRECONDITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno (asiento descuadrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  /runDepreciationForMonth:
    post:
      tags: [Accounting]
      summary: "Ejecutar depreciación manual para un mes específico"
      description: |
        Permite al usuario ejecutar la depreciación de activos fijos desde el frontend
        para un mes y año concretos. Usa la misma lógica que el scheduled
        `runMonthlyDepreciation`.

        **Idempotente:** si ya existe un asiento de depreciación para ese mes y empresa,
        devuelve `skipped: true` sin crear duplicados.

        El caller debe pertenecer a la empresa (`callerCompanyId === companyId`).

        **Efectos secundarios:** crea `journal_entry` de tipo `depreciation`, actualiza
        `accumulatedDepreciation`, `remainingValue` y `lastDepreciationMonthKey` en cada activo.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/RunDepreciationForMonthRequest'
      responses:
        '200':
          description: Depreciación procesada o skipped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/RunDepreciationForMonthResponse'
        '400':
          description: Argumento inválido (month fuera de rango, year no entero, companyId vacío).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: Sin permisos (el caller no pertenece a la empresa).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  /generateOpeningEntry:
    post:
      tags: [Accounting]
      summary: "Generar asiento de apertura para un nuevo ejercicio contable"
      description: |
        Lee los saldos de las cuentas de Balance General (grupos 1, 2, 3) del período
        anterior (`year - 1`, estado `closed` o `locked`) y crea el asiento de apertura
        para el nuevo período.

        **Validaciones:**
        - `newPeriodId` debe existir con `status: 'open'` y sin `openingEntryId` ya asignado.
        - Si no existe período anterior cerrado, crea un asiento de apertura vacío
          (primer ejercicio de la empresa).

        **Efectos secundarios:** crea `journal_entry` de tipo `opening`, actualiza
        `openingEntryId` en el período.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/GenerateOpeningEntryRequest'
      responses:
        '200':
          description: Asiento de apertura creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/GenerateOpeningEntryResponse'
        '400':
          description: Argumento inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '404':
          description: Período no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '409':
          description: El período ya tiene un asiento de apertura (ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '428':
          description: El período destino no está abierto o no hay saldos en el período anterior (FAILED_PRECONDITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno (asiento descuadrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  /generateAccountingPdf:
    post:
      tags: [Accounting]
      summary: "Generar PDF de reporte contable (Libro Diario, Mayor, Balance, etc.)"
      description: |
        Genera el PDF de un reporte contable en memoria y lo devuelve como Base64.
        El frontend pre-calcula las filas y las envía en `data`; la función solo se
        encarga del formato y la renderización PDF.

        **Tipos de reporte soportados:**
        - `libro-diario` — Libro Diario con totales de débito/crédito.
        - `libro-mayor` — Libro Mayor por cuenta con saldo acumulado.
        - `balance-comprobacion` — Balance de Comprobación con saldos deudores/acreedores.
        - `estado-resultados` — Estado de Resultados (ingresos y costos/gastos).
        - `balance-general` — Balance General en dos columnas (Activos | Pasivos+Patrimonio).

        Para `estado-resultados` y `balance-general`, los datos principales van en `extraData`.

        **Timeout:** 60 segundos. Memoria: 512 MiB.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/GenerateAccountingPdfRequest'
      responses:
        '200':
          description: PDF generado como Base64.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/GenerateAccountingPdfResponse'
        '400':
          description: Argumento inválido (reportType o companyId faltantes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  # ────────────────────────────────────────────────────────────────────────────────
  # USERS
  # ────────────────────────────────────────────────────────────────────────────────
  /createCompanyUser:
    post:
      tags: [Users]
      summary: "Crear un usuario de empresa en Firebase Auth + Firestore"
      description: |
        Crea el usuario en Firebase Auth (Admin SDK), le asigna custom claims
        `{ companyId, role: platformRole }` y escribe el perfil en
        `companies/{companyId}/company-users/{uid}`.

        **Por qué Cloud Function:** el SDK de Firebase Client autentica al nuevo usuario
        como efecto secundario al crearlo, lo que no es deseable. El Admin SDK no tiene
        este problema.

        **Permisos:**
        - `admin` puede crear usuarios en su propia empresa (no puede asignar rol `admin`).
        - `super_admin` puede crear usuarios en cualquier empresa, incluyendo rol `admin`.
        - Nadie puede asignar `super_admin` desde esta función.

        **Rollback:** si `setCustomUserClaims` falla tras crear el doc en Firestore,
        se borra el doc para mantener consistencia.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/CreateCompanyUserRequest'
      responses:
        '200':
          description: Usuario creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/CreateCompanyUserResponse'
        '400':
          description: Argumento inválido (email inválido, contraseña débil, rol inválido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: Sin permisos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '409':
          description: Ya existe un usuario con ese email (ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  /updateCompanyUser:
    post:
      tags: [Users]
      summary: "Actualizar perfil, rol o estado de un usuario de empresa"
      description: |
        Actualiza `displayName`, `platformRole` (y sus custom claims), `isActive`
        (habilita/deshabilita en Firebase Auth) y `personaId`. Solo se actualizan
        los campos que se envíen (parcial).

        **Rollback:** si actualizar claims falla, revierte el `platformRole` en Firestore.

        **Permisos:**
        - `admin` puede modificar usuarios de su propia empresa.
        - `super_admin` puede modificar cualquier usuario.
        - No puede asignarse el rol `super_admin`.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/UpdateCompanyUserRequest'
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/UpdateCompanyUserResponse'
        '400':
          description: Argumento inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: Sin permisos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '404':
          description: Usuario no encontrado en Firebase Auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  /deleteCompanyUser:
    post:
      tags: [Users]
      summary: "Eliminar permanentemente un usuario de empresa"
      description: |
        Solo `super_admin`. Elimina el documento en `companies/{companyId}/company-users/{uid}`
        y el usuario de Firebase Auth.

        **Orden de operaciones:** Firestore primero, Auth después. Si Auth falla, el usuario
        queda sin acceso a la empresa (se loguea para limpieza manual).

        **No permite auto-eliminación** (el caller no puede eliminarse a sí mismo).

        Para desactivar temporalmente, usar `updateCompanyUser` con `isActive: false`.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/DeleteCompanyUserRequest'
      responses:
        '200':
          description: Usuario eliminado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/DeleteCompanyUserResponse'
        '400':
          description: Argumento inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: Sin permisos (requiere super_admin) o intento de auto-eliminación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '404':
          description: Usuario no encontrado en Firebase Auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno (error al eliminar de Auth tras borrar de Firestore).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  # ────────────────────────────────────────────────────────────────────────────────
  # SCHOOL BAR
  # ────────────────────────────────────────────────────────────────────────────────
  /schoolScanQr:
    post:
      tags: [SchoolBar]
      summary: "Validar token QR de un alumno y obtener sus datos para el POS"
      description: |
        Valida la firma HMAC-SHA256 del token QR del alumno (timing-safe compare para
        prevenir timing attacks). El token tiene el formato:
        `base64url(payload_json).hmacHex`

        Donde `payload_json = { studentId, companyId, version }`.

        El secret HMAC se configura en la variable de entorno `SCHOOL_QR_SECRET`.

        **Validaciones:**
        1. El caller está autenticado y pertenece a la empresa del QR.
        2. La firma HMAC es válida.
        3. El `companyId` del payload coincide con el solicitado.
        4. El alumno existe en `companies/{companyId}/school_students/{studentId}`.
        5. El alumno tiene `state: true` (activo).

        Devuelve solo los campos necesarios para el POS (sin datos sensibles).
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/SchoolScanQrRequest'
      responses:
        '200':
          description: Token válido. Datos del alumno para el POS.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/SchoolScanQrResponse'
        '400':
          description: Token con formato inválido o payload incompleto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: Firma HMAC inválida o QR no pertenece a esta empresa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '404':
          description: Alumno no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '428':
          description: Alumno inactivo (FAILED_PRECONDITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  # ────────────────────────────────────────────────────────────────────────────────
  # UTILS
  # ────────────────────────────────────────────────────────────────────────────────
  /downloadDocument:
    post:
      tags: [Utils]
      summary: "Obtener URL pública de descarga de un documento (XML o PDF)"
      description: |
        Resuelve el path de Storage según el tipo de documento y tipo de archivo,
        verifica que el archivo exista y devuelve la URL pública de Cloud Storage.

        **Paths de Storage por tipo:**
        - `invoice` XML: `companies/{cid}/xml/{id}-signed.xml`
        - `invoice` PDF: `companies/{cid}/pdf/{id}.pdf`
        - `creditNote` XML: `companies/{cid}/xml/{id}-signed.xml`
        - `creditNote` PDF: `companies/{cid}/pdf/cn-{id}.pdf`
        - `retention` XML: `companies/{cid}/xml/ret-{id}-signed.xml`
        - `retention` PDF: `companies/{cid}/pdf/ret-{id}.pdf`
        - `debitNote` XML: `companies/{cid}/xml/dn-{id}-signed.xml`
        - `debitNote` PDF: `companies/{cid}/pdf/dn-{id}.pdf`

        **Permisos:** usuario de la empresa o `super_admin`.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/DownloadDocumentRequest'
      responses:
        '200':
          description: URL de descarga generada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/DownloadDocumentResponse'
        '400':
          description: Argumento inválido (documentType o fileType no reconocidos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: Sin permisos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '404':
          description: Archivo no encontrado en Cloud Storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  # ────────────────────────────────────────────────────────────────────────────────
