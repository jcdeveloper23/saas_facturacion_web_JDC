  /assignPlanToCompany:
    post:
      tags: [Tenants]
      summary: "Asignar un plan a una empresa existente"
      description: |
        Solo `super_admin`. Lee el plan de `/plans/{planId}`, calcula los `enabledModules`
        (unión del plan + paquetes adicionales ya habilitados), y desnormaliza
        `planLimits`, `planFeatures` y `enabledModules` en el documento de la empresa.
        También calcula y actualiza `subscriptionEnd` basado en el `billingPeriod` del plan
        (monthly=30 días, yearly=365 días).
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/AssignPlanToCompanyRequest'
      responses:
        '200':
          description: Plan asignado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/AssignPlanToCompanyResponse'
        '400':
          description: Argumento inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: Sin permisos (requiere super_admin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '404':
