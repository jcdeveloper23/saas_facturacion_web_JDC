  /onInvoiceEmit:
    post:
      tags: [Triggers]
      summary: "TRIGGER — Orquestador del pipeline SRI para facturas y notas de crédito"
      description: |
        **Tipo:** `onDocumentWritten`
        **Path Firestore:** `companies/{companyId}/invoices/{invoiceId}`
        **Sin endpoint HTTP directo.**

        Se activa cuando un documento de la colección `invoices` cambia. Solo procesa
        cuando `status` cambia a `'issued'` y `sriStatus` no está aún establecido
        (evita doble procesamiento).

        **Pipeline para facturas (codDoc=01):**
        1. Marca `sriStatus: 'pending'` (barrera de idempotencia).
        2. Incrementa contadores de uso en `companies/{companyId}/usage/{YYYY-MM}`.
        3. Verifica límites del plan (`electronicInvoicing` feature y `invoicesPerMonth`).
        4. `generateInvoiceXmlInternal` — genera XML.
        5. `signXmlInternal` — firma XAdES-BES.
        6. `sendToSriInternal` — envía al SRI SOAP.
        7. `generatePdfInternal` — genera RIDE PDF.
        8. `sendInvoiceEmailInternal` — envía email si está autorizada.

        **Pipeline para notas de crédito (isCreditNote=true, codDoc=04):**
        Mismo flujo pero usando `generateCreditNoteXmlInternal`, `cn-{id}.xml` como
        nombre de archivo, `sendToSriInternal` con `docType='creditNote'`,
        `generateCreditNotePdfInternal` y `sendCreditNoteEmailInternal`.

        **Errores:** no re-lanza excepciones. En caso de error, actualiza
        `sriStatus: 'rejected'` con el mensaje de error para que el UI lo muestre.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Solo referencia — esta función no tiene endpoint HTTP directo.

