  /schoolProcessPurchase:
    post:
      tags: [Triggers]
      summary: "TRIGGER — Procesar compra del bar escolar al crear orden"
      description: |
        **Tipo:** `onDocumentCreated`
        **Path Firestore:** `companies/{companyId}/school_orders/{orderId}`
        **Sin endpoint HTTP directo.**

        Es el único punto que descuenta el wallet del alumno. Solo procesa órdenes con
        `status: 'pending'` y sin `walletTransactionId` (idempotencia doble).

        Dentro de una transacción atómica:
        1. Re-lee la orden y el alumno.
        2. Verifica saldo suficiente (`walletBalance >= order.total`).
        3. Si saldo insuficiente: cancela la orden con motivo.
        4. Si saldo suficiente:
           - Crea `SchoolTransaction` (`type: 'purchase'`) en `school_transactions`.
           - Descuenta `walletBalance` en `school_students`.
           - Marca la orden `status: 'confirmed'` con `walletTransactionId`.

        **Errores:** no re-lanza. Cancela la orden con el mensaje de error.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Solo referencia — esta función no tiene endpoint HTTP directo.

