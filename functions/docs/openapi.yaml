openapi: "3.0.3"
info:
  title: "SaasFacturacion — Referencia de Cloud Functions"
  description: |
    Documentación completa de todas las Firebase Cloud Functions del proyecto SaasFacturacion Ecuador.

    ## Protocolo Firebase Callable
    Todas las funciones marcadas como "Callable" siguen el protocolo Firebase Cloud Functions:
    - **Método:** siempre POST
    - **URL:** https://us-central1-facturasproec.cloudfunctions.net/{functionName}
    - **Request body:** siempre `{ "data": { ...parámetros } }`
    - **Response:** siempre `{ "result": { ...respuesta } }` en éxito
    - **Auth:** Bearer token de Firebase ID Token en header Authorization

    ## Funciones Background (Triggers y Scheduled)
    Las funciones de tipo Trigger y Scheduled no tienen endpoint HTTP directo.
    Se documentan aquí como referencia de cuándo se ejecutan y qué hacen.

    ## Roles del sistema
    - `super_admin` — Acceso total a la plataforma. Sin companyId.
    - `admin` — Administrador de una empresa. companyId en claims.
    - `seller`, `accountant`, `cashier`, `read_only` — Roles de empresa con permisos acotados.
  version: "1.0.0"
  contact:
    email: "jrodriguez@dycotein.com"

servers:
  - url: "https://us-central1-facturasproec.cloudfunctions.net"
    description: "Producción"
  - url: "http://localhost:5001/facturasproec/us-central1"
    description: "Emuladores locales (firebase emulators:start)"

security:
  - FirebaseIdToken: []

components:
  securitySchemes:
    FirebaseIdToken:
      type: http
      scheme: bearer
      description: "Firebase ID Token. Obtener con: firebase.auth().currentUser.getIdToken()"

  schemas:
    # ── Error genérico Firebase Callable ─────────────────────────────────────────
    CallableError:
      type: object
      properties:
        error:
          type: object
          properties:
            status:
              type: string
              enum:
                - INVALID_ARGUMENT
                - NOT_FOUND
                - PERMISSION_DENIED
                - UNAUTHENTICATED
                - INTERNAL
                - ALREADY_EXISTS
                - RESOURCE_EXHAUSTED
                - FAILED_PRECONDITION
                - UNAVAILABLE
            message:
              type: string
            details:
              type: object

    # ── Auth ──────────────────────────────────────────────────────────────────────
    SetUserCustomClaimsRequest:
      type: object
      required: [targetUid, companyId, role]
      properties:
        targetUid:
          type: string
          description: "UID del usuario de Firebase Auth al que asignar los claims."
        companyId:
          type: string
          description: "ID de la empresa que se asociará al usuario."
        role:
          type: string
          description: "Código de rol. Solo letras minúsculas, dígitos y guiones bajos (máx. 50 chars). Ejemplo: seller, accountant, cashier."
          pattern: "^[a-z][a-z0-9_]{0,49}$"

    SetUserCustomClaimsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        uid:
          type: string
        companyId:
          type: string
        role:
          type: string

    SetupFirstAdminRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: "Email del primer super_admin."
        password:
          type: string
          minLength: 8
          description: "Contraseña (mínimo 8 caracteres)."

    SetupFirstAdminResponse:
      type: object
      properties:
        success:
          type: boolean
        uid:
          type: string
          description: "UID del super_admin creado en Firebase Auth."
        message:
          type: string
          example: "Super administrador creado correctamente. Ya puedes iniciar sesión."

    # ── Tenants ───────────────────────────────────────────────────────────────────
    SriSetupInput:
      type: object
      required: [environment, ruc, businessName, establishment, emissionPoint, contributorType, accountingRequired]
      properties:
        environment:
          type: string
          enum: [testing, production]
        ruc:
          type: string
          description: "RUC de 13 dígitos."
        businessName:
          type: string
        establishment:
          type: string
          example: "001"
        emissionPoint:
          type: string
          example: "001"
        contributorType:
          type: string
          enum: [natural, juridica]
        accountingRequired:
          type: boolean
        contribuyenteEspecial:
          type: string
          nullable: true
          description: "Número de resolución de contribuyente especial. Opcional."
        microempresa:
          type: boolean
          nullable: true
        regimen:
          type: string
          nullable: true
          enum: [general, rimpe_negocio_popular, rimpe_emprendedor]

    SetupCompanyRequest:
      type: object
      required: [name, taxId, fiscalAddress, city, phone, email, planId, planName, status, subscriptionEnd, sri]
      properties:
        name:
          type: string
          description: "Razón social de la empresa."
        taxId:
          type: string
          description: "RUC de la empresa."
        fiscalAddress:
          type: string
        city:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          description: "Email corporativo. Si se proporciona adminPassword, también es el email del usuario admin."
        adminPassword:
          type: string
          nullable: true
          description: "Si se proporciona, crea un usuario admin en Firebase Auth con este email y contraseña."
        planId:
          type: string
          description: "ID del plan en /plans/{planId}."
        planName:
          type: string
        status:
          type: string
          example: "active"
        subscriptionEnd:
          type: string
          format: date-time
          description: "Fecha ISO de fin de suscripción."
        sri:
          $ref: '#/components/schemas/SriSetupInput'

    SetupCompanyResponse:
      type: object
      properties:
        companyId:
          type: string
          description: "ID del documento recién creado en /companies/{companyId}."

    AssignPlanToCompanyRequest:
      type: object
      required: [companyId, planId]
      properties:
        companyId:
          type: string
        planId:
          type: string

    AssignPlanToCompanyResponse:
      type: object
      properties:
        success:
          type: boolean
        companyId:
          type: string
        planId:
          type: string

    CheckPlanLimitRequest:
      type: object
      required: [companyId, limitType]
      properties:
        companyId:
          type: string
        limitType:
          type: string
          enum:
            - invoices
            - creditNotes
            - debitNotes
            - retentions
            - totalSriDocs
            - personas
            - customers
            - products
            - warehouses
            - users
            - customRoles
            - activeProjects
            - exports
            - tasks
          description: |
            Tipo de límite a verificar:
            - `invoices` / `creditNotes` / `debitNotes` / `retentions` / `totalSriDocs` — documentos SRI por mes (fuente: usage/{YYYY-MM})
            - `personas` / `customers` / `products` / `warehouses` / `users` / `customRoles` / `activeProjects` — campos del documento de empresa
            - `exports` / `tasks` — contadores de uso mensual

    CheckPlanLimitResponse:
      type: object
      properties:
        allowed:
          type: boolean
          description: "true si se puede continuar la operación."
        current:
          type: integer
          description: "Uso actual."
        limit:
          type: integer
          description: "-1 = ilimitado, 0 = deshabilitado, >0 = límite concreto."
        limitType:
          type: string

    # ── Invoices / SRI ────────────────────────────────────────────────────────────
    UploadCertificateRequest:
      type: object
      required: [companyId, certificateBase64, password]
      properties:
        companyId:
          type: string
        certificateBase64:
          type: string
          description: "Contenido del archivo .p12 en Base64."
        password:
          type: string
          description: "Contraseña del certificado .p12."

    UploadCertificateResponse:
      type: object
      properties:
        success:
          type: boolean
        thumbprint:
          type: string
          description: "SHA1 fingerprint del certificado."
        subject:
          type: string
          description: "Subject DN del certificado X.509."
        expiresAt:
          type: string
          format: date-time
          description: "Fecha de expiración del certificado."
        expiresIn:
          type: integer
          description: "Días hasta la expiración."

    GenerateInvoiceXmlRequest:
      type: object
      required: [invoiceId, companyId]
      properties:
        invoiceId:
          type: string
          description: "ID del documento en companies/{companyId}/invoices/{invoiceId}."
        companyId:
          type: string

    GenerateInvoiceXmlResponse:
      type: object
      properties:
        invoiceId:
          type: string
        accessKey:
          type: string
          description: "Clave de acceso SRI de 49 dígitos."
        xmlUrl:
          type: string
          format: uri
          description: "URL pública del XML en Cloud Storage."
        sriStatus:
          type: string
          example: "xml_generated"
        fullNumber:
          type: string
          description: "Número completo estab-ptoEmi-secuencial. Ejemplo: 001-001-000000001."
        nextStep:
          type: string
          example: "signXml"

    GenerateCreditNoteXmlRequest:
      type: object
      required: [creditNoteId, companyId]
      properties:
        creditNoteId:
          type: string
          description: "ID del documento de nota de crédito en companies/{companyId}/invoices/{creditNoteId} (isCreditNote=true)."
        companyId:
          type: string

    GenerateCreditNoteXmlResponse:
      type: object
      properties:
        accessKey:
          type: string
          description: "Clave de acceso SRI de 49 dígitos."
        xmlUrl:
          type: string
          format: uri

    SignXmlRequest:
      type: object
      required: [invoiceId, companyId]
      properties:
        invoiceId:
          type: string
          description: "ID del documento (factura o nota de crédito). La función obtiene la contraseña del certificado desde Firestore."
        companyId:
          type: string

    SignXmlResponse:
      type: object
      properties:
        invoiceId:
          type: string
        accessKey:
          type: string
        sriStatus:
          type: string
          example: "signed"
        signedXmlUrl:
          type: string
          format: uri
          description: "URL pública del XML firmado con XAdES-BES en Cloud Storage."
        nextStep:
          type: string
          example: "sendToSri"

    SendToSriRequest:
      type: object
      required: [companyId]
      properties:
        documentId:
          type: string
          description: "ID del documento. Acepta también `invoiceId` para compatibilidad retroactiva."
        invoiceId:
          type: string
          description: "Alias retroactivo de documentId."
        documentType:
          type: string
          enum: [invoice, retention, debitNote, creditNote]
          default: invoice
          description: "Tipo de documento a enviar al SRI."
        companyId:
          type: string

    SendToSriResponse:
      type: object
      properties:
        documentId:
          type: string
        companyId:
          type: string
        sriStatus:
          type: string
          enum: [authorized, rejected, pending]
        authorizationNumber:
          type: string
          nullable: true
          description: "Número de autorización SRI (49 dígitos). Solo presente si authorized."
        authorizedAt:
          type: string
          format: date-time
          nullable: true
        estado:
          type: string
          description: "Estado SOAP devuelto por el SRI."
        mensaje:
          type: string
          nullable: true
        detalle:
          type: string
          nullable: true
        sriError:
          type: string
          nullable: true
        nextStep:
          type: string
          nullable: true
          example: "generatePdf"

    CheckSriStatusRequest:
      type: object
      required: [companyId]
      properties:
        documentId:
          type: string
          description: "ID del documento. También acepta `invoiceId` para compatibilidad retroactiva."
        invoiceId:
          type: string
          description: "Alias retroactivo de documentId."
        companyId:
          type: string
        documentType:
          type: string
          enum: [invoice, retention, debitNote]
          default: invoice

    CheckSriStatusResponse:
      type: object
      properties:
        sriStatus:
          type: string
          enum: [authorized, rejected, pending, xml_generated, signed]
        authorizationNumber:
          type: string
          nullable: true
        estado:
          type: string
          description: "Estado SOAP directo del SRI: AUTORIZADO | NO AUTORIZADO | RECHAZADO | PENDIENTE."
        mensaje:
          type: string

    GeneratePdfRequest:
      type: object
      required: [invoiceId, companyId]
      properties:
        invoiceId:
          type: string
        companyId:
          type: string

    GeneratePdfResponse:
      type: object
      properties:
        pdfUrl:
          type: string
          format: uri
          description: "URL pública del PDF RIDE generado en Cloud Storage."

    SendInvoiceEmailRequest:
      type: object
      required: [invoiceId, companyId]
      properties:
        invoiceId:
          type: string
        companyId:
          type: string

    SendInvoiceEmailResponse:
      type: object
      properties:
        sent:
          type: boolean
          description: "false si la factura no tiene email de cliente registrado."
        to:
          type: string
          description: "Dirección de email a la que se envió. Vacío si sent=false."

    GenerateCreditNotePdfRequest:
      type: object
      required: [creditNoteId, companyId]
      properties:
        creditNoteId:
          type: string
        companyId:
          type: string

    GenerateCreditNotePdfResponse:
      type: object
      properties:
        success:
          type: boolean

    SendCreditNoteEmailRequest:
      type: object
      required: [creditNoteId, companyId]
      properties:
        creditNoteId:
          type: string
        companyId:
          type: string

    SendCreditNoteEmailResponse:
      type: object
      properties:
        sent:
          type: boolean
        to:
          type: string

    # ── Retentions ────────────────────────────────────────────────────────────────
    GenerateRetentionXmlRequest:
      type: object
      required: [retentionId, companyId]
      properties:
        retentionId:
          type: string
          description: "ID del documento en companies/{companyId}/retentions/{retentionId}."
        companyId:
          type: string

    GenerateRetentionXmlResponse:
      type: object
      properties:
        accessKey:
          type: string
          description: "Clave de acceso SRI de 49 dígitos."
        xmlUrl:
          type: string
          format: uri

    GenerateRetentionPdfRequest:
      type: object
      required: [retentionId, companyId]
      properties:
        retentionId:
          type: string
        companyId:
          type: string

    GenerateRetentionPdfResponse:
      type: object
      properties:
        pdfUrl:
          type: string
          format: uri

    SendRetentionEmailRequest:
      type: object
      required: [retentionId, companyId]
      properties:
        retentionId:
          type: string
        companyId:
          type: string

    SendRetentionEmailResponse:
      type: object
      properties:
        sent:
          type: boolean
        to:
          type: string

    # ── Debit Notes ───────────────────────────────────────────────────────────────
    GenerateDebitNoteXmlRequest:
      type: object
      required: [debitNoteId, companyId]
      properties:
        debitNoteId:
          type: string
          description: "ID del documento en companies/{companyId}/debitNotes/{debitNoteId}."
        companyId:
          type: string

    GenerateDebitNoteXmlResponse:
      type: object
      properties:
        accessKey:
          type: string
        xmlUrl:
          type: string
          format: uri

    GenerateDebitNotePdfRequest:
      type: object
      required: [debitNoteId, companyId]
      properties:
        debitNoteId:
          type: string
        companyId:
          type: string

    GenerateDebitNotePdfResponse:
      type: object
      properties:
        pdfUrl:
          type: string
          format: uri

    SendDebitNoteEmailRequest:
      type: object
      required: [debitNoteId, companyId]
      properties:
        debitNoteId:
          type: string
        companyId:
          type: string

    SendDebitNoteEmailResponse:
      type: object
      properties:
        sent:
          type: boolean
        to:
          type: string

    # ── Accounting ────────────────────────────────────────────────────────────────
    CloseAccountingPeriodRequest:
      type: object
      required: [companyId, periodId]
      properties:
        companyId:
          type: string
        periodId:
          type: string
          description: "ID del período contable en companies/{companyId}/accounting_periods/{periodId}. Debe tener status='open'."

    CloseAccountingPeriodResponse:
      type: object
      properties:
        success:
          type: boolean
        entryId:
          type: string
          nullable: true
          description: "ID del asiento de cierre creado. null si el período no tenía movimientos."
        totalIncome:
          type: number
          nullable: true
        totalExpense:
          type: number
          nullable: true
        netResult:
          type: number
          nullable: true
          description: "Resultado neto: positivo=utilidad, negativo=pérdida."
        message:
          type: string

    RunDepreciationForMonthRequest:
      type: object
      required: [companyId, year, month]
      properties:
        companyId:
          type: string
        year:
          type: integer
          description: "Año a procesar. Ejemplo: 2025."
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: "Mes a procesar (1-12)."

    RunDepreciationForMonthResponse:
      type: object
      properties:
        success:
          type: boolean
        assetsProcessed:
          type: integer
          description: "Cantidad de activos fijos depreciados."
        entryId:
          type: string
          nullable: true
          description: "ID del journal_entry de depreciación creado."
        skipped:
          type: boolean
          nullable: true
          description: "true si ya existía un asiento de depreciación para ese mes o si no hay activos que depreciar."
        message:
          type: string

    GenerateOpeningEntryRequest:
      type: object
      required: [companyId, newPeriodId]
      properties:
        companyId:
          type: string
        newPeriodId:
          type: string
          description: "ID del período contable de destino (el nuevo ejercicio). Debe tener status='open' y no tener openingEntryId."

    GenerateOpeningEntryResponse:
      type: object
      properties:
        success:
          type: boolean
        entryId:
          type: string
          description: "ID del asiento de apertura creado."
        linesCount:
          type: integer
          nullable: true
          description: "Número de líneas del asiento de apertura."
        totalDebit:
          type: number
        totalCredit:
          type: number
        message:
          type: string

    ReportLine:
      type: object
      description: "Fila de datos pre-calculada por el frontend para incluir en el PDF."
      additionalProperties:
        oneOf:
          - type: string
          - type: number

    GenerateAccountingPdfRequest:
      type: object
      required: [reportType, companyId, periodName, data]
      properties:
        reportType:
          type: string
          enum:
            - libro-diario
            - libro-mayor
            - balance-comprobacion
            - estado-resultados
            - balance-general
        companyId:
          type: string
        periodName:
          type: string
          description: "Nombre del período para el encabezado del PDF. Ejemplo: 'Enero 2025'."
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportLine'
          description: "Filas pre-calculadas por el frontend."
        extraData:
          type: object
          description: "Totales, secciones y datos adicionales dependiendo del tipo de reporte."
          nullable: true
          additionalProperties: true

    GenerateAccountingPdfResponse:
      type: object
      properties:
        pdf:
          type: string
          description: "Contenido del PDF en Base64."
        filename:
          type: string
          description: "Nombre de archivo sugerido. Ejemplo: libro-diario-Enero_2025.pdf."

    # ── Users ─────────────────────────────────────────────────────────────────────
    CreateCompanyUserRequest:
      type: object
      required: [email, password, displayName, platformRole, companyId]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        displayName:
          type: string
        platformRole:
          type: string
          description: "Código de rol. No puede ser super_admin. Para asignar admin solo super_admin puede hacerlo."
          pattern: "^[a-z][a-z0-9_]{0,49}$"
        companyId:
          type: string
        personaId:
          type: string
          nullable: true
          description: "ID de persona asociada (opcional). Vincula el usuario a un documento en personas."

    CreateCompanyUserResponse:
      type: object
      properties:
        uid:
          type: string
        email:
          type: string
        displayName:
          type: string
        platformRole:
          type: string

    UpdateCompanyUserRequest:
      type: object
      required: [uid, companyId]
      properties:
        uid:
          type: string
          description: "UID del usuario a modificar."
        companyId:
          type: string
        displayName:
          type: string
          nullable: true
        platformRole:
          type: string
          nullable: true
          description: "Nuevo rol. Si se cambia, actualiza los custom claims JWT. No puede ser super_admin."
        isActive:
          type: boolean
          nullable: true
          description: "false deshabilita la cuenta en Firebase Auth."
        personaId:
          type: string
          nullable: true

    UpdateCompanyUserResponse:
      type: object
      properties:
        success:
          type: boolean
        uid:
          type: string

    DeleteCompanyUserRequest:
      type: object
      required: [uid, companyId]
      properties:
        uid:
          type: string
          description: "UID del usuario a eliminar permanentemente. No puede ser el mismo caller."
        companyId:
          type: string

    DeleteCompanyUserResponse:
      type: object
      properties:
        success:
          type: boolean
        uid:
          type: string

    # ── School Bar ────────────────────────────────────────────────────────────────
    SchoolScanQrRequest:
      type: object
      required: [token, companyId]
      properties:
        token:
          type: string
          description: "Token QR del alumno. Formato: base64url(payload).hmacHex. Generado automáticamente al crear el alumno."
        companyId:
          type: string

    SchoolScanQrResponse:
      type: object
      properties:
        studentId:
          type: string
        fullName:
          type: string
        code:
          type: string
          description: "Código interno del alumno."
        gradeId:
          type: string
        gradeName:
          type: string
        section:
          type: string
        walletBalance:
          type: number
          description: "Saldo actual del monedero escolar en USD."

    # ── Utils ─────────────────────────────────────────────────────────────────────
    DownloadDocumentRequest:
      type: object
      required: [documentType, documentId, companyId, fileType]
      properties:
        documentType:
          type: string
          enum: [invoice, creditNote, retention, debitNote]
        documentId:
          type: string
        companyId:
          type: string
        fileType:
          type: string
          enum: [xml, pdf]

    DownloadDocumentResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: "URL pública de Cloud Storage del archivo solicitado."

    # ── DevTools ──────────────────────────────────────────────────────────────────
    GetAuthTokenRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: "Email del usuario registrado en Firebase Auth."
          example: "admin@miempresa.com"
        password:
          type: string
          format: password
          description: "Contraseña del usuario."
          example: "micontraseña123"

    GetAuthTokenResponse:
      type: object
      properties:
        idToken:
          type: string
          description: |
            Firebase ID Token JWT. Úsalo en el header de todas las Cloud Functions callable:
            `Authorization: Bearer <idToken>`
          example: "eyJhbGciOiJSUzI1NiIsImtpZCI6..."
        expiresIn:
          type: string
          description: "Tiempo de vida del token en segundos. Default Firebase: 3600 (1 hora)."
          example: "3600"
        tokenType:
          type: string
          example: "Bearer"
        uid:
          type: string
          description: "UID del usuario en Firebase Auth."
        companyId:
          type: string
          nullable: true
          description: "companyId del custom claim. null si el usuario es super_admin sin empresa vinculada."
        role:
          type: string
          nullable: true
          description: "Rol del usuario: admin, seller, accountant, cashier, read_only, super_admin."
        usage:
          type: string
          example: "Agrega el idToken en el header: Authorization: Bearer <idToken>"

    # ── createAndEmitInvoice ──────────────────────────────────────────────────────
    ExternalInvoiceLine:
      type: object
      required: [description, quantity, unitPrice, vatPct]
      properties:
        sku:
          type: string
          nullable: true
          description: "Código del producto en el sistema de origen."
          example: "PROD-001"
        description:
          type: string
          description: "Descripción del producto o servicio."
          example: "Servicio de consultoría mensual"
        quantity:
          type: number
          format: float
          description: "Cantidad. Acepta decimales (hasta 6 según XSD del SRI)."
          example: 2
        unitPrice:
          type: number
          format: float
          description: "Precio unitario sin IVA."
          example: 100.00
        discountPct:
          type: number
          format: float
          nullable: true
          description: "Porcentaje de descuento sobre la línea (0-100). Default: 0."
          example: 0
        vatPct:
          type: number
          enum: [0, 5, 15]
          description: |
            Porcentaje de IVA según tarifas vigentes Ecuador 2024+:
            - `0` — Tarifa 0% (exento o no objeto de IVA)
            - `5` — Tarifa 5%
            - `15` — Tarifa 15% (tarifa general vigente)
          example: 15
        unit:
          type: string
          nullable: true
          description: "Unidad de medida. Default: UNIDAD."
          example: "HORA"

    ExternalCustomer:
      type: object
      required: [taxId, taxIdType, name]
      properties:
        taxId:
          type: string
          description: |
            Número de identificación del comprador.
            - RUC: 13 dígitos
            - Cédula: 10 dígitos
            - Pasaporte: alfanumérico
            - Consumidor Final: exactamente `9999999999999`
          example: "1712345678001"
        taxIdType:
          type: string
          enum: [RUC, CI, PASAPORTE, CONSUMIDOR_FINAL, EXTERIOR]
          description: "Tipo de identificación del comprador."
          example: "RUC"
        name:
          type: string
          description: "Razón social o nombre completo del comprador."
          example: "EMPRESA CLIENTE S.A."
        email:
          type: string
          format: email
          nullable: true
          description: "Email del comprador. Se usa para envío automático del PDF RIDE."
          example: "facturacion@cliente.com"
        address:
          type: string
          nullable: true
          description: "Dirección del comprador (para infoAdicional del XML)."
          example: "Av. Amazonas 123, Quito"

    ExternalPaymentMethod:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: |
            Código SRI de forma de pago (Tabla 24 Ficha Técnica SRI):
            - `01` — Sin utilización del sistema financiero (efectivo)
            - `15` — Compensación de deudas
            - `16` — Tarjeta de débito
            - `17` — Dinero electrónico
            - `18` — Tarjeta prepago
            - `19` — Tarjeta de crédito
            - `20` — Otros con utilización del sistema financiero
            - `21` — Endoso de títulos
          example: "01"
        amount:
          type: number
          format: float
          nullable: true
          description: "Monto de este método de pago. Si se omite, se usa el total de la factura."
          example: 230.00
        deadline:
          type: integer
          nullable: true
          description: "Plazo en unidades de tiempo. Para pago inmediato: 0."
          example: 0
        timeUnit:
          type: string
          nullable: true
          description: "Unidad de tiempo del plazo: dias, meses, anios."
          example: "dias"

    CreateAndEmitInvoiceRequest:
      type: object
      required: [companyId, customer, lines]
      properties:
        companyId:
          type: string
          description: |
            ID de la empresa en Firestore (`companies/{companyId}`).
            **Seguridad:** se valida contra el `companyId` del Firebase ID Token.
            Un usuario no puede emitir facturas en nombre de otra empresa.
          example: "abc123xyz"
        externalId:
          type: string
          nullable: true
          description: |
            ID de la factura en el sistema de origen (idempotencia).
            Si ya existe un documento con el mismo `externalId` para este `companyId`,
            se retorna ese documento sin crear uno nuevo.
          example: "buseta-inv-2026-001"
        source:
          type: string
          nullable: true
          description: "Etiqueta del sistema que origina la factura (trazabilidad)."
          example: "flutter_app"
        date:
          type: string
          format: date
          nullable: true
          description: "Fecha de emisión YYYY-MM-DD. Default: fecha actual (zona Ecuador)."
          example: "2026-09-03"
        customer:
          $ref: '#/components/schemas/ExternalCustomer'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ExternalInvoiceLine'
        paymentMethods:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ExternalPaymentMethod'
          description: "Si se omite, se usa pago inmediato en efectivo (código 01) por el total."
        notes:
          type: string
          nullable: true
          description: "Notas internas. No aparecen en el XML del SRI."
        mode:
          type: string
          enum: [async, sync]
          default: async
          description: |
            - `async` (default): retorna `{ invoiceId, status: 'processing' }` inmediatamente.
              El pipeline SRI corre en background. Usar `checkSriStatus` para consultar el resultado.
            - `sync`: espera hasta que el SRI responda (o hasta `syncTimeoutMs`).
              Retorna el resultado completo en una sola llamada. Riesgo de timeout con SRI lento.
        syncTimeoutMs:
          type: integer
          nullable: true
          description: "Solo en mode=sync. Tiempo máximo de espera en ms. Default: 45000. Máximo: 90000."
          example: 45000

    CreateAndEmitInvoiceResponse:
      type: object
      properties:
        invoiceId:
          type: string
          description: "ID del documento creado en `companies/{companyId}/invoices/{invoiceId}`."
          example: "Kj8mN2pQrT4w"
        fullNumber:
          type: string
          description: "Número de factura asignado: estab-ptoEmi-secuencial."
          example: "001-001-000000042"
        status:
          type: string
          enum: [processing, authorized, rejected, not_required, plan_limit_reached]
          description: |
            - `processing`: factura creada, pipeline SRI corriendo en background (modo async o timeout sync).
            - `authorized`: SRI autorizó el comprobante (solo en modo sync con respuesta a tiempo).
            - `rejected`: SRI rechazó el comprobante (solo en modo sync).
            - `not_required`: empresa sin facturación electrónica habilitada en el plan.
            - `plan_limit_reached`: límite mensual de facturas SRI alcanzado.
        isDuplicate:
          type: boolean
          nullable: true
          description: "true si se retornó un documento existente por coincidencia de externalId."
        message:
          type: string
          nullable: true
          description: "Mensaje descriptivo del estado. Incluye instrucción de polling en modo async."
        accessKey:
          type: string
          nullable: true
          description: "Clave de acceso SRI de 49 dígitos. Solo disponible en modo sync cuando authorized."
        authorizationNumber:
          type: string
          nullable: true
          description: "Número de autorización SRI. Solo disponible en modo sync cuando authorized."
        authorizedAt:
          type: object
          nullable: true
          description: "Timestamp de autorización SRI."
        xmlUrl:
          type: string
          format: uri
          nullable: true
          description: "URL del XML original en Cloud Storage. Solo en modo sync."
        signedXmlUrl:
          type: string
          format: uri
          nullable: true
          description: "URL del XML firmado XAdES-BES en Cloud Storage. Solo en modo sync."
        pdfUrl:
          type: string
          format: uri
          nullable: true
          description: "URL del PDF RIDE en Cloud Storage. Solo en modo sync cuando authorized."
        sriError:
          type: string
          nullable: true
          description: "Mensaje de error del SRI. Solo en modo sync cuando rejected."

tags:
  - name: Auth
    description: "Autenticación y asignación de roles custom claims."
  - name: Tenants
    description: "Setup y configuración de empresas (tenants). Acceso restringido a super_admin."
  - name: Invoices
    description: "Pipeline SRI para facturas electrónicas: XML, firma XAdES-BES, envío al SRI, PDF RIDE, email."
  - name: CreditNotes
    description: "Pipeline SRI para notas de crédito electrónicas (codDoc=04). Los documentos se almacenan en la misma colección que facturas con isCreditNote=true."
  - name: DebitNotes
    description: "Pipeline SRI para notas de débito electrónicas (codDoc=05)."
  - name: Retentions
    description: "Pipeline SRI para comprobantes de retención electrónicos (codDoc=07)."
  - name: Accounting
    description: "Módulo contable: cierre de ejercicio, depreciaciones, asientos de apertura y PDFs de reportes financieros."
  - name: Users
    description: "Gestión de usuarios de empresa. Las operaciones de creación y eliminación usan Firebase Admin SDK para no autenticar al nuevo usuario en el proceso."
  - name: SchoolBar
    description: "Módulo de bar escolar: validación de QR, procesamiento de compras y recargas de monedero."
  - name: Utils
    description: "Utilidades generales."
  - name: Triggers
    description: "Funciones background disparadas por cambios en Firestore. Sin endpoint HTTP directo. Solo referencia."
  - name: Scheduled
    description: "Funciones que corren en horario automático (Cloud Scheduler). Sin endpoint HTTP directo. Solo referencia."
  - name: DevTools
    description: |
      Herramientas de desarrollo e integración. Facilitan pruebas desde Postman, Swagger UI, curl
