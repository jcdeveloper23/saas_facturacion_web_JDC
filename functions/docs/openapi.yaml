        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  /checkPlanLimit:
    post:
      tags: [Tenants]
      summary: "Verificar si una empresa ha alcanzado un límite de su plan"
      description: |
        Cualquier usuario autenticado puede llamar esta función.
        Consulta el documento de la empresa y (para límites basados en uso) el documento
        `companies/{companyId}/usage/{YYYY-MM}` para comparar el uso actual vs el límite del plan.

        **Convenciones de respuesta:**
        - `limit = -1` → ilimitado, siempre `allowed: true`
        - `limit = 0` → deshabilitado, siempre `allowed: false`
        - `limit > 0` → `allowed = current < limit`
        - Si la empresa no tiene `planLimits` (empresa legacy), devuelve `allowed: true` sin bloquear.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/CheckPlanLimitRequest'
      responses:
        '200':
          description: Resultado de la verificación.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/CheckPlanLimitResponse'
        '400':
          description: Argumento inválido o limitType no reconocido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '404':
          description: Empresa no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  # ────────────────────────────────────────────────────────────────────────────────
  # INVOICES / SRI
  # ────────────────────────────────────────────────────────────────────────────────
  /uploadCertificate:
    post:
      tags: [Invoices]
      summary: "Subir certificado de firma electrónica .p12"
      description: |
        Valida el certificado .p12 con node-forge (parsea el archivo, extrae el certificado X.509,
        verifica que no esté vencido, valida el RUC contra el subject si está configurado).
        Guarda el .p12 en Cloud Storage en `companies/{companyId}/certificates/signing.p12`
        y actualiza los campos `sri.certificate*` en el documento de la empresa.

        **Permisos:** `admin` de la empresa o `super_admin`.

        **ADVERTENCIA DE SEGURIDAD:** La contraseña del certificado se almacena en Firestore
        para que las funciones de firma puedan accederla en tiempo de ejecución sin exposición
        al frontend.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/UploadCertificateRequest'
      responses:
        '200':
          description: Certificado validado y guardado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/UploadCertificateResponse'
        '400':
          description: Certificado inválido, contraseña incorrecta o certificado vencido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: Sin permisos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '404':
          description: Empresa no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  /generateInvoiceXml:
    post:
      tags: [Invoices]
      summary: "Generar XML SRI de una factura (paso 1/4 del pipeline)"
      description: |
        Lee la factura de Firestore, lee la configuración SRI de la empresa y genera el XML
        según la Ficha Técnica SRI v2.32. Calcula la clave de acceso de 49 dígitos con el
        dígito verificador por módulo 11. Soporta IVA 15%, 5%, 0% y exento.

        El XML se sube a Cloud Storage en `companies/{companyId}/xml/{invoiceId}.xml`
        y se actualiza `sriStatus: 'xml_generated'` en el documento de la factura.

        **Normalmente llamado automáticamente por `onInvoiceEmit` trigger.**
        También puede llamarse manualmente para reprocesar.

        **Permisos:** usuario de la empresa o `super_admin`.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/GenerateInvoiceXmlRequest'
      responses:
        '200':
          description: XML generado y subido a Storage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/GenerateInvoiceXmlResponse'
        '400':
          description: Argumento inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: Sin permisos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno (factura no encontrada, empresa sin configuración SRI, error de Storage).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  /generateCreditNoteXml:
    post:
      tags: [CreditNotes]
      summary: "Generar XML SRI de una nota de crédito (paso 1/4)"
      description: |
        Lee el documento de nota de crédito (almacenado en `companies/{companyId}/invoices/` con
        `isCreditNote=true`) y genera el XML `<notaCredito>` según la Ficha Técnica SRI v2.32
        (codDoc=04). El XML se sube a `companies/{companyId}/xml/cn-{creditNoteId}.xml`.

        **Requiere que la nota de crédito tenga `isCreditNote=true`, de lo contrario retorna error.**

        **Permisos:** usuario de la empresa o `super_admin`.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/GenerateCreditNoteXmlRequest'
      responses:
        '200':
          description: XML de nota de crédito generado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/GenerateCreditNoteXmlResponse'
        '400':
          description: Argumento inválido o documento no es nota de crédito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: Sin permisos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  /signXml:
    post:
      tags: [Invoices]
      summary: "Firmar XML con XAdES-BES usando el certificado .p12 de la empresa (paso 2/4)"
      description: |
        Descarga el XML sin firmar de Storage, descarga el certificado .p12 de Storage,
        lee la contraseña desde Firestore (campo `sri.certificatePassword` en el documento
        de la empresa), y aplica la firma XAdES-BES (XML Advanced Electronic Signatures –
        Basic Electronic Signature) según los requisitos del SRI Ecuador.

        El XML firmado se guarda en `companies/{companyId}/xml/{invoiceId}-signed.xml`.

        Para notas de crédito, el trigger `onInvoiceEmit` llama esta función con el
        nombre de archivo `cn-{invoiceId}.xml`.

        **Permisos:** usuario de la empresa o `super_admin`.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/SignXmlRequest'
      responses:
        '200':
          description: XML firmado y guardado en Storage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/SignXmlResponse'
        '400':
          description: Argumento inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: Sin permisos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno (XML no encontrado, certificado no encontrado, error de firma).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  /sendToSri:
    post:
      tags: [Invoices]
      summary: "Enviar documento firmado al SRI mediante SOAP (paso 3/4)"
      description: |
        Función unificada para todos los tipos de documentos electrónicos.
        Descarga el XML firmado de Storage, lo convierte a Base64 y lo envía al
        web service SOAP del SRI (`RecepcionComprobantesOffline`). Implementa retry
        con backoff exponencial (3 intentos: 1s, 2s, 4s).

        Tras recepción exitosa (`RECIBIDA`), espera 5 segundos y consulta la autorización
        (`AutorizacionComprobantesOffline`) con 1 reintento a los 5s.

        Los endpoints del SRI se leen de `platform/defaults/sriConfig/data`; si no existe,
        usa las URLs por defecto hardcodeadas (testing/producción).

        **Actualiza en Firestore:** `sriStatus`, `authorizationNumber`, `authorizedAt`, `sriError`.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/SendToSriRequest'
      responses:
        '200':
          description: Resultado del envío al SRI (puede ser authorized, rejected o pending).
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/SendToSriResponse'
        '400':
          description: Argumento inválido o documentType no reconocido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: Sin permisos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  /checkSriStatus:
    post:
      tags: [Invoices]
      summary: "Consultar el estado de autorización en el SRI en tiempo real"
      description: |
        Consulta directamente el WS SOAP del SRI (`AutorizacionComprobantesOffline`)
        usando la clave de acceso almacenada en el documento. Actualiza el estado en
        Firestore si el SRI devuelve AUTORIZADO o NO AUTORIZADO.

        Útil para documentos en estado `pending` que quedaron sin respuesta de autorización.

        **Permisos:** usuario de la empresa o `super_admin`.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/CheckSriStatusRequest'
      responses:
        '200':
          description: Estado de autorización del SRI.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/CheckSriStatusResponse'
        '400':
          description: Argumento inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: Sin permisos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '404':
          description: Documento no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '503':
          description: Error de red al consultar el SRI (UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

