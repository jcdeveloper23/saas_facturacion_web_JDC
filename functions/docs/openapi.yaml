      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/GeneratePdfRequest'
      responses:
        '200':
          description: PDF generado y subido a Storage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/GeneratePdfResponse'
        '400':
          description: Argumento inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: Sin permisos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
