  # ────────────────────────────────────────────────────────────────────────────────
  # SCHEDULED
  # ────────────────────────────────────────────────────────────────────────────────
  /runMonthlyDepreciation:
    post:
      tags: [Scheduled]
      summary: "SCHEDULED — Depreciación mensual automática de activos fijos"
      description: |
        **Tipo:** `onSchedule`
        **Horario:** `0 6 1 * *` (día 1 de cada mes a las 06:00 hora Ecuador — America/Guayaquil)
        **Sin endpoint HTTP directo.**

        Procesa el mes anterior (no el mes en curso) para todas las empresas activas.
        Por cada empresa:
        1. Verifica idempotencia (busca journal_entry de tipo `depreciation` para el mes).
        2. Obtiene activos fijos activos con valor depreciable restante.
        3. Calcula depreciación lineal mensual: `(costo - valorResidual) / vidaUtilMeses`.
        4. Consolida líneas por cuenta contable.
        5. Crea `journal_entry` con `status: 'posted'` y `type: 'depreciation'`.
        6. Actualiza `accumulatedDepreciation`, `remainingValue` y `lastDepreciationMonthKey`
           en cada activo (en batches de 400).

        Si una empresa falla, continúa con las demás (error aislado).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Solo referencia — esta función no tiene endpoint HTTP directo.

  /detectOverdueTasksScheduled:
    post:
      tags: [Scheduled]
      summary: "SCHEDULED — Detectar tareas vencidas y notificar"
      description: |
        **Tipo:** `onSchedule`
        **Horario:** diario (frecuencia exacta definida en el código fuente del módulo team-management).
        **Sin endpoint HTTP directo.**

        Consulta tareas con `dueDate < now` y `status != completed/cancelled` en todas
        las empresas, y actualiza su estado a `overdue` o envía notificaciones según
        la configuración.
      requestBody:
        required: false
