paths:
  # ────────────────────────────────────────────────────────────────────────────────
  # AUTH
  # ────────────────────────────────────────────────────────────────────────────────
  /setUserCustomClaims:
    post:
      tags: [Auth]
      summary: "Asignar companyId y rol (custom claims) a un usuario"
      description: |
        Asigna los custom claims `companyId` y `role` a un usuario de Firebase Auth existente.
        Estos claims quedan disponibles en el JWT en requests posteriores.

        **Permisos:**
        - `admin` puede gestionar usuarios de su propia empresa únicamente.
        - `super_admin` puede gestionar cualquier usuario y asignar el rol `super_admin`.
        - Ningún otro rol puede llamar esta función.

        **Efectos secundarios:** actualiza `companies/{companyId}/users/{targetUid}` y `users/{targetUid}` en Firestore.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/SetUserCustomClaimsRequest'
      responses:
        '200':
          description: Claims asignados correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/SetUserCustomClaimsResponse'
        '400':
          description: Argumento inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: Sin permisos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  /setupFirstAdmin:
    post:
      tags: [Auth]
      summary: "Crear el primer super_admin (bootstrap inicial)"
      description: |
        Crea el primer usuario `super_admin` del sistema. Solo funciona cuando no existe
        ningún super_admin en la colección `users`. Una vez creado el primer super_admin,
        esta función devuelve `ALREADY_EXISTS`.

        **IMPORTANTE:** Esta función no requiere autenticación (bootstrap). Debe deshabilitarse
        después de la configuración inicial del sistema.

        **Efectos secundarios:** crea el usuario en Firebase Auth, asigna claims `role: super_admin`,
        y escribe el documento en `users/{uid}`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/SetupFirstAdminRequest'
      responses:
        '200':
          description: Super admin creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/SetupFirstAdminResponse'
        '400':
          description: Argumento inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '409':
          description: Ya existe un super admin (ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  # ────────────────────────────────────────────────────────────────────────────────
  # DEVTOOLS — Autenticación rápida para pruebas e integraciones
  # ────────────────────────────────────────────────────────────────────────────────
  /getAuthToken:
    post:
      tags: [DevTools]
      summary: "Obtener Firebase ID Token a partir de email + password"
      description: |
        Endpoint HTTP (no callable) para obtener un Firebase ID Token sin necesidad
        del SDK de Firebase. Diseñado para pruebas rápidas desde Postman, Swagger UI,
        curl o cualquier cliente HTTP, y para sistemas externos (Spring Boot, scripts,
        CI/CD) que necesitan autenticarse.

        **Flujo:**
        1. Envía `{ email, password }` en el body.
        2. La función llama a la Firebase Auth REST API y retorna el `idToken`.
        3. Usa el `idToken` en el header `Authorization: Bearer <idToken>` en todas
           las llamadas a las Cloud Functions callable.

        **Nota:** El token expira en 1 hora (3600 segundos). Puedes guardarlo y
        reutilizarlo hasta su expiración.

        **Nota de seguridad:** Este endpoint es una herramienta de desarrollo.
        Para producción, usar el SDK de Firebase en el cliente.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAuthTokenRequest'
            examples:
              admin:
                summary: "Login como admin de empresa"
                value:
                  email: "admin@miempresa.com"
                  password: "contraseña123"
              superadmin:
                summary: "Login como super_admin"
                value:
                  email: "superadmin@facturasec.com"
                  password: "contraseña123"
      responses:
        '200':
          description: "Token generado correctamente."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuthTokenResponse'
              example:
                idToken: "eyJhbGciOiJSUzI1NiIsImtpZCI6..."
                expiresIn: "3600"
                tokenType: "Bearer"
                uid: "aBcDeFgH123"
                companyId: "empresa-xyz-001"
                role: "admin"
                usage: "Agrega el idToken en el header: Authorization: Bearer <idToken>"
        '400':
          description: "Email o password faltante."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "INVALID_ARGUMENT" }
                  message: { type: string, example: "email es requerido." }
        '401':
          description: "Credenciales incorrectas."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "INVALID_CREDENTIALS" }
                  message: { type: string, example: "Email o contraseña incorrectos." }
        '403':
          description: "Usuario deshabilitado."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "USER_DISABLED" }
                  message: { type: string }
        '429':
          description: "Demasiados intentos fallidos."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "TOO_MANY_ATTEMPTS" }
                  message: { type: string }
        '500':
          description: "Error interno."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "INTERNAL" }
                  message: { type: string }

  # ────────────────────────────────────────────────────────────────────────────────
  # INVOICES — createAndEmitInvoice (puerta de entrada para sistemas externos)
  # ────────────────────────────────────────────────────────────────────────────────
  /createAndEmitInvoice:
    post:
      tags: [Invoices]
      summary: "Crear y emitir factura electrónica desde un sistema externo"
      description: |
        **Función puente para sistemas externos** (Flutter, Spring Boot, ERPs, Zapier, etc.)
        que necesitan emitir facturas electrónicas sin acceso directo a Firestore.

        Acepta el payload completo de la factura, crea el documento en Firestore con el
        secuencial correcto, y dispara automáticamente el pipeline SRI completo:
        `XML → firma XAdES-BES → SRI → PDF RIDE → email`.

        ### Modos de operación

        **Modo async (recomendado):**
        Retorna `{ invoiceId, status: 'processing' }` inmediatamente.
        Luego hacer polling con `checkSriStatus` hasta obtener `authorized` o `rejected`.

        **Modo sync:**
        Espera hasta que el SRI responda. Retorna el resultado completo en una sola llamada.
        Útil para integraciones simples. Riesgo de timeout si el SRI tarda más de `syncTimeoutMs`.

        ### Idempotencia
        Si se envía el campo `externalId`, la función es idempotente: si ya existe un documento
        con ese `externalId` para el mismo `companyId`, retorna ese documento sin crear uno nuevo.

        ### Seguridad multi-tenant
        El `companyId` se valida contra el claim del token JWT. Un usuario no puede emitir
        facturas en nombre de una empresa diferente a la suya.

        ### Cálculo automático de totales
        No es necesario calcular `subtotal`, `vatAmount` ni `total` — la función los calcula
        automáticamente desde `quantity`, `unitPrice`, `discountPct` y `vatPct` de cada línea.

        ### Polling con checkSriStatus (modo async)
        ```
        POST /checkSriStatus
        { "data": { "invoiceId": "<invoiceId>", "companyId": "<companyId>" } }
        ```
        Consultar cada 2-3 segundos hasta que `sriStatus` sea `authorized` o `rejected`.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/CreateAndEmitInvoiceRequest'
            examples:
              flutter_async:
                summary: "Desde Flutter — modo async (recomendado)"
                value:
                  data:
                    companyId: "empresa-xyz-001"
                    externalId: "flutter-inv-2026-001"
                    source: "flutter_app"
                    mode: "async"
                    date: "2026-09-03"
                    customer:
                      taxId: "1712345678"
                      taxIdType: "CI"
                      name: "Juan Pérez"
                      email: "juan@email.com"
                    lines:
                      - sku: "SERV-001"
                        description: "Servicio de consultoría"
                        quantity: 2
                        unitPrice: 100.00
                        vatPct: 15
                    paymentMethods:
                      - code: "01"
                        amount: 230.00
              spring_boot_sync:
                summary: "Desde Spring Boot — modo sync"
                value:
                  data:
                    companyId: "empresa-xyz-001"
                    externalId: "buseta-factura-20260903-001"
                    source: "buseta_backend"
                    mode: "sync"
                    syncTimeoutMs: 45000
                    date: "2026-09-03"
                    customer:
                      taxId: "0912345678001"
                      taxIdType: "RUC"
                      name: "EMPRESA CLIENTE S.A."
                      email: "contabilidad@cliente.com"
                      address: "Av. Patria 123, Quito"
                    lines:
                      - sku: "RUTA-001"
                        description: "Servicio de transporte urbano — Ruta Norte"
                        quantity: 1
                        unitPrice: 200.00
                        vatPct: 15
                      - sku: "RUTA-002"
                        description: "Servicio de transporte urbano — Ruta Sur"
                        quantity: 1
                        unitPrice: 150.00
                        vatPct: 0
                    paymentMethods:
                      - code: "19"
                        amount: 230.00
              consumidor_final:
                summary: "Consumidor Final (sin identificación)"
                value:
                  data:
                    companyId: "empresa-xyz-001"
                    mode: "async"
                    customer:
                      taxId: "9999999999999"
                      taxIdType: "CONSUMIDOR_FINAL"
                      name: "CONSUMIDOR FINAL"
                    lines:
                      - description: "Producto varios"
                        quantity: 3
                        unitPrice: 10.00
                        vatPct: 15
      responses:
        '200':
          description: "Factura creada. Pipeline SRI iniciado."
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/CreateAndEmitInvoiceResponse'
              examples:
                async_processing:
                  summary: "Respuesta modo async"
                  value:
                    result:
                      invoiceId: "Kj8mN2pQrT4w"
                      fullNumber: "001-001-000000042"
                      status: "processing"
                      message: "Factura creada. Use checkSriStatus({ invoiceId, companyId }) para consultar el resultado."
                sync_authorized:
                  summary: "Respuesta modo sync — SRI autorizó"
                  value:
                    result:
                      invoiceId: "Kj8mN2pQrT4w"
                      fullNumber: "001-001-000000042"
                      status: "authorized"
                      accessKey: "0309202601179012345678001120010010000000421234567812"
                      authorizationNumber: "0309202601179012345678001120010010000000421234567812"
                      pdfUrl: "https://storage.googleapis.com/facturasproec.appspot.com/companies/.../pdf/Kj8mN2pQrT4w.pdf"
                duplicate:
                  summary: "Respuesta de duplicado (mismo externalId)"
                  value:
                    result:
                      invoiceId: "Kj8mN2pQrT4w"
                      fullNumber: "001-001-000000042"
                      status: "authorized"
                      isDuplicate: true
        '400':
          description: "Payload inválido."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
              examples:
                missing_lines:
                  value:
                    error:
                      status: "INVALID_ARGUMENT"
                      message: "lines debe ser un arreglo con al menos un elemento."
                invalid_vat:
                  value:
                    error:
                      status: "INVALID_ARGUMENT"
                      message: "lines[0].vatPct debe ser 0, 5 o 15. Recibido: 12"
        '401':
          description: "No autenticado."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '403':
          description: "Sin permisos para operar en esa empresa."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '404':
          description: "Empresa no encontrada."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '412':
          description: "Empresa sin configuración SRI completa (establishment/emissionPoint faltante)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
        '500':
          description: "Error interno."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'

  # ────────────────────────────────────────────────────────────────────────────────
  # TENANTS
  # ────────────────────────────────────────────────────────────────────────────────
  /setupCompany:
    post:
      tags: [Tenants]
      summary: "Crear una nueva empresa (tenant) con datos por defecto"
      description: |
        Llamada por `super_admin` para crear un nuevo tenant. Lee los datos por defecto de
        `platform/defaults` y los copia a la empresa. Si no existen datos en platform, usa
        valores hardcodeados como fallback.

        **Crea en Firestore:**
        - `companies/{companyId}` — documento principal
        - `companies/{companyId}/configuration/sri` — configuración SRI
        - `companies/{companyId}/configuration/general` — configuración general
        - `companies/{companyId}/warehouses/*` — bodegas
        - `companies/{companyId}/taxRates/*` — tasas de impuesto
        - `companies/{companyId}/paymentTerms/*` — condiciones de pago
        - `companies/{companyId}/documentSeries/*` — series de documentos
        - `companies/{companyId}/currencies/*` — monedas
        - `companies/{companyId}/countries/*` — países
        - `companies/{companyId}/roles/*` — roles de empresa (seller, accountant, cashier, read_only)
        - `companies/{companyId}/company-users/{adminUid}` — si se proporciona adminPassword

        Si se proporciona `adminPassword`, también crea el usuario en Firebase Auth y asigna claims `role: admin`.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
