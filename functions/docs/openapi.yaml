      summary: "Generar PDF RIDE de una factura (paso 4/4)"
      description: |
        Genera el Representación Impresa del Documento Electrónico (RIDE) de una factura
        usando PDFKit. Incluye QR code de la clave de acceso.
        El PDF se guarda en `companies/{companyId}/pdf/{invoiceId}.pdf` y se actualiza
        `pdfUrl` en el documento de la factura.

