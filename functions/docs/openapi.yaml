  /schoolGenerateStudentQr:
    post:
      tags: [Triggers]
      summary: "TRIGGER — Generar QR del alumno al crearse el documento"
      description: |
        **Tipo:** `onDocumentCreated`
        **Path Firestore:** `companies/{companyId}/school_students/{studentId}`
        **Sin endpoint HTTP directo.**

        Se activa al crear un nuevo alumno. Construye el payload `{ studentId, companyId, version: 1 }`,
        lo firma con HMAC-SHA256 usando el secret `SCHOOL_QR_SECRET`, genera la imagen PNG del QR,
        la sube a `school-bar/{companyId}/students/{studentId}/qr.png` en Storage, y escribe
        `qrCode` + `qrCodeUrl` en el documento del alumno.

        **Idempotente:** si `qrCode` ya existe, no hace nada.
        **Errores:** escribe `qrError` en el documento sin re-lanzar (evita retries).
