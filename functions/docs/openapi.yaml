    post:
      tags: [Triggers]
      summary: "TRIGGER — Acreditar recarga al wallet del alumno cuando es confirmada"
      description: |
        **Tipo:** `onDocumentUpdated`
        **Path Firestore:** `companies/{companyId}/school_recharges/{rechargeId}`
        **Sin endpoint HTTP directo.**

        Se activa cuando `paymentStatus` cambia a `'confirmed'`. Dentro de una transacción
        atómica: crea `SchoolTransaction` (`type: 'recharge'`), incrementa `walletBalance`
        del alumno, y actualiza la recarga con `walletTransactionId`, `balanceBefore` y
        `balanceAfter`.

        **Idempotente:** doble barrera (before/after check + `walletTransactionId` dentro de tx).
        **Errores:** no re-lanza. Escribe `rechargeError` en el documento.
      requestBody:
        required: false
