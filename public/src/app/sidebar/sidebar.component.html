  <ul class="nav" cdkDropList (cdkDropListDropped)="drop($event)">
    <!-- Se ajusta el padding y margen para un look más compacto -->
    <li routerLinkActive="active active-blue" *ngFor="let menuitem of menuItems" class="py-1 px-3 sidebar-item" cdkDrag>

      <!-- Drag Handle (CSS Grip) -->
      <div class="drag-handle" cdkDragHandle title="Reordenar menú">
        <!-- Using CSS to create 6 dots grid -->
        <span class="grip-dots"></span>
      </div>

      <!-- Drag Preview (Custom visual for dragging) -->
      <div *cdkDragPreview class="drag-preview">
        <span>{{menuitem.title}}</span>
      </div>

      <!--If is a single link-->
      <a [routerLink]="[menuitem.path]" *ngIf="menuitem.type === 'link'" class="nav-link d-flex align-items-center p-0">
        <i class="{{menuitem.icontype}}"></i>
        <p>{{menuitem.title}}</p>
        <!-- Badge solo si es el menú de órdenes y hay pendientes -->
        <span *ngIf="menuitem.path === '/paymentConfirmation' && this.arrayOrders.length > 0"
          class="badge badge-success badge-num-order ml-auto">
          {{ this.arrayOrders.length }}
        </span>
      </a>
      <!--If it have a submenu-->
      <a data-toggle="collapse" href="#{{menuitem.collapse}}" *ngIf="menuitem.type === 'sub'" class="nav-link p-0">
        <i class="{{menuitem.icontype}}"></i>
        <p>{{menuitem.title}}<b class="caret"></b></p>
      </a>

      <!--Display the submenu items-->
      <div id="{{menuitem.collapse}}" class="collapse" *ngIf="menuitem.type === 'sub'">
        <!-- Se añade 'nav-compact' para un submenú más ajustado -->
        <ul class="nav nav-compact pl-3">
          <li routerLinkActive="active active-blue" *ngFor="let childitem of menuitem.children" class="nav-item py-1">
            <a [routerLink]="[menuitem.path, childitem.path]" class="nav-link">
              <!-- Se usa un ícono de punto para un look más limpio en submenús -->
              <i class="nc-icon nc-bullet-list-67"></i>
              <span>{{childitem.title}}</span>
            </a>
          </li>
        </ul>
      </div>
    </li>
  </ul>

</div>
