<div class="main-content">
    <app-loading></app-loading>

    <div class="row m-0 p-0 w-100">
        <div class="col-sm-8">
        </div>

        <!-- *** numero de paises activos *** -->
        <div class="col-12 col-sm-6 col-md-6 col-lg-4 m-0 p-0">
            <div class="card card-stats container-fluid-body">
                <div class="card-body">
                    <div class="row">
                        <div class="col-7 col-md-8">
                            <div class="numbers">
                                <p class="card-category">Total de países</p>
                                <p class="card-title mt-4 mb-5">
                                    {{ arrayAllergies.length }}
                                </p>
                            </div>
                        </div>
                        <div class="col-5 col-md-4">
                            <div class="icon-big text-center bg-purple-dark p-3 mx-0">
                                <img src="../../../../assets/img/icons/users.png" alt="" srcset="">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <button class="btn btn-primary btn-block" (click)="newAllergies()">Nuevo</button>
                </div>
            </div>
        </div>
    </div>
    <div class="row m-0 p-0 w-100">
        <div class="row w-100 m-0 p-0 mt-2 container-fluid-body">
            <div class="col-12 p-0 w-100 container-fluid-body m-0 p-0 table-responsive">
                <table mat-table matSort [dataSource]="dataSource"
                    class="mat-elevation-z8 table-reponsive table-bordered container-fluid-body text-white"
                    style="min-width: 100%;">
                    <ng-container matColumnDef="code">
                        <th mat-header-cell *matHeaderCellDef class="text-center title-table m-0 p-0">
                            Código
                        </th>
                        <td mat-cell *matCellDef="let row" class="text-center">
                            <span>
                                #{{row.allergiesId | slice:6}}
                            </span>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef class="text-center title-table m-0 p-0">
                            Nombre
                        </th>
                        <td mat-cell *matCellDef="let row" class="text-center">
                            <span>{{row.allergiesName}}</span>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="phone">
                        <th mat-header-cell *matHeaderCellDef class="text-center title-table m-0 p-0">
                            Teléfono soporte
                        </th>
                        <td mat-cell *matCellDef="let row" class="text-center">
                            <span>{{row.allergiesPhone}}</span>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef class="text-center title-table m-0 p-0">
                            Estado
                        </th>
                        <td mat-cell *matCellDef="let row" class="text-center">
                            <i *ngIf="row.allergiesState" class="fa fa-check text-primary" aria-hidden="true"></i>
                            <i *ngIf="!row.allergiesState" class="fa fa-times text-danger" aria-hidden="true"></i>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="edit">
                        <th mat-header-cell *matHeaderCellDef class="text-center title-table m-0 p-0">
                            Editar
                        </th>
                        <td mat-cell *matCellDef="let row" class="text-center">
                            <i class="fa fa-pencil-square cursor-pointer text-warning btn-functions  cursor-pointer"
                                aria-hidden="true" (click)="editAllergies(row)"></i>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="delete">
                        <th mat-header-cell *matHeaderCellDef class="text-center title-table m-0 p-0">
                            Eliminar
                        </th>
                        <td mat-cell *matCellDef="let row" class="text-center">
                            <i class="fa fa-trash text-danger cursor-pointer btn-functions cursor-pointer "
                                aria-hidden="true" type="button" (click)="deleteAllergies(row)"></i>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                </table>
                <mat-paginator [pageSizeOptions]="[10, 25, 50]" #tableAllegies showFirstLastButtons>
                </mat-paginator>

            </div>
        </div>
    </div>
</div>




<!-- *** Modal New User *** -->
<div class="modal fade" id="modalNewAllergies" tabindex="-1" role="dialog" aria-labelledby="ModalLabel"
    aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content container-fluid-body">
            <div class="modal-header justify-content-center text-white">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <i class="nc-icon nc-simple-remove text-white"></i>
                </button>
                <h4 class="card-title">{{isEdit ? 'Actualizar' : 'Nueva'}}
                    Alergia
                </h4>
            </div>
            <div class="modal-body">
                <form #formAllergies="ngForm" novalidate (ngSubmit)="saveAllergies(formAllergies.valid, formAllergies)">
                    <div class="row w-100 m-0 p-0">
                        <div class="col-12">
                            <div class="form-group has-label">
                                <div class="row w-100 m-0 p-0 mb-3">
                                    <input readonly type="hidden" class="form-control" name="allergiesId" placeholder="Id"
                                        [(ngModel)]="allergies.allergiesId" required #allergiesId="ngModel">

                                    <!-- <div class="col-12 col-sm-6 col-md-6 col-lg-6 mb-3 ">
                                        <label class="control-label" for="">Código
                                            <span class="star">*</span>
                                        </label>
                                        <input type="text" class="form-control" name="allergiesCode" placeholder="Código"
                                            [(ngModel)]="allergies.allergiesCode" required #allergiesCode="ngModel">
                                        <small
                                            [hidden]="allergiesCode.valid || (allergiesCode.pristine && !formAllergies.submitted)"
                                            class="text-danger">
                                            Nombres requeridos.
                                        </small>
                                    </div> -->


                                    <div class="col-12 col-sm-12 col-md-12 col-lg-12 mb-3 ">
                                        <label class="control-label" for="">Nombre
                                            <span class="star">*</span>
                                        </label>
                                        <input type="text" class="form-control" name="allergiesName" placeholder="Nombre"
                                            [(ngModel)]="allergies.allergiesName" required #allergiesName="ngModel">
                                        <small
                                            [hidden]="allergiesName.valid || (allergiesName.pristine && !formAllergies.submitted)"
                                            class="text-danger">
                                            Nombres requeridos.
                                        </small>
                                    </div>

                                    <div class="col-12 col-sm-6 col-md-6 col-lg-6 pt-3">
                                        <button type="submit" class="btn btn-primary text-btn-form btn-block">
                                            {{isEdit ? 'Actualizar' : 'Guardar'}}
                                        </button>
                                        <div class="category"> <span class="star">*</span> Campos requeridos
                                        </div>
                                    </div>
                                    <div class="col-12 col-sm-6 col-md-6 col-lg-6 pt-3">
                                        <button type="button" (click)="cancelViewForm(formAllergies)"
                                            class="btn btn-danger text-btn-form btn-block">
                                            Cancelar
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- *** #Modal New User *** -->
