<!-- Commission Editor Component -->
<div class="commission-card" *ngIf="user">
    <h6 class="text-white mb-2" style="font-size: 0.8rem;">
        <i class="nc-icon nc-chart-bar-32"></i> Comisión de Viajes
    </h6>

    <div class="commission-content">
        <!-- Display Mode -->
        <div *ngIf="!isEditingCommission" class="commission-display">
            <div class="commission-rate-display">
                <div class="rate-circle">
                    <span class="rate-number">{{ getUserCommissionRate(user) }}</span>
                    <span class="rate-symbol">%</span>
                </div>
                <div class="rate-info">
                    <small class="text-muted">Comisión por viaje</small>
                    <p class="text-white mb-0 small">
                        {{ user.userCommissionCustomEnabled ? 'Personalizada' : 'Por defecto' }}
                    </p>
                </div>
            </div>

            <button class="btn btn-primary btn-sm btn-block mt-2" (click)="startEditingCommission()">
                <i class="nc-icon nc-settings-gear-65"></i>
                Editar Comisión
            </button>
        </div>

        <!-- Edit Mode -->
        <div *ngIf="isEditingCommission" class="commission-edit">
            <div class="form-group">
                <label class="text-white mb-2" style="font-size: 0.8rem;">
                    <i class="nc-icon nc-chart-bar-32"></i>
                    Nueva Tasa de Comisión (%)
                </label>
                <input type="number" class="form-control commission-input"
                    [(ngModel)]="newCommissionRate" min="0" max="100" step="0.5" placeholder="0-100">
                <small class="text-muted" style="font-size: 0.7rem;">
                    Rango permitido: 0% - 100%
                </small>
            </div>

            <div class="form-group">
                <label class="text-white mb-2" style="font-size: 0.8rem;">
                    <i class="nc-icon nc-notes"></i>
                    Motivo del cambio (opcional)
                </label>
                <textarea class="form-control commission-textarea" [(ngModel)]="commissionChangeReason"
                    rows="3" placeholder="Ej: Alto rendimiento, Incentivo especial, etc."></textarea>
            </div>

            <div class="d-flex justify-content-between mt-3">
                <button class="btn btn-secondary btn-sm" (click)="cancelEditingCommission()">
                    <i class="nc-icon nc-simple-remove"></i>
                    Cancelar
                </button>
                <button class="btn btn-success btn-sm" (click)="saveCommissionChange()"
                    [disabled]="!isCommissionValid()">
                    <i class="nc-icon nc-check-2"></i>
                    Guardar Cambios
                </button>
            </div>
        </div>
    </div>

    <!-- Commission History -->
    <div class="commission-history mt-3"
        *ngIf="user.userCommissionHistory && user.userCommissionHistory.length > 0">
        <h6 class="text-white mb-2" style="font-size: 0.75rem;">
            <i class="nc-icon nc-bullet-list-67"></i>
            Historial de Cambios (Últimos 3)
        </h6>
        <div class="history-list">
            <div class="history-item"
                *ngFor="let change of user.userCommissionHistory.slice(0, 3)">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="flex-grow-1">
                        <p class="mb-0 text-white" style="font-size: 0.7rem;">
                            <span class="badge badge-secondary badge-xs">{{ change.previousRate }}%</span>
                            <i class="nc-icon nc-minimal-right mx-1"></i>
                            <span class="badge badge-primary badge-xs">{{ change.newRate }}%</span>
                        </p>
                        <p class="mb-0 text-muted" style="font-size: 0.65rem;" *ngIf="change.reason">
                            {{ change.reason }}
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="mb-0 text-muted" style="font-size: 0.6rem;">
                            {{ change.date }}
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
