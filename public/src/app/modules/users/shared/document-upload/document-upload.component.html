<div class="document-upload-container">
    <div class="document-preview">
        <!-- Image Preview -->
        <div class="doc-image-wrapper">
            <img [src]="getDisplayUrl()" [alt]="documentLabel" class="doc-image">
            <div class="doc-overlay" (click)="triggerFileInput()">
                <i class="nc-icon nc-cloud-upload-94"></i>
                <span>{{ hasNewFile ? 'Cambiar' : 'Subir' }} Imagen</span>
            </div>
        </div>

        <!-- Verification Badge -->
        <div class="verification-badge" *ngIf="isVerified && !hasNewFile">
            <i class="nc-icon nc-check-2"></i>
            <span>Verificado</span>
        </div>
        <div class="verification-badge pending" *ngIf="hasNewFile">
            <i class="nc-icon nc-time-alarm"></i>
            <span>Pendiente</span>
        </div>
    </div>

    <!-- Hidden File Input -->
    <input type="file"
           [id]="'file-' + documentLabel"
           accept="image/jpeg, image/jpg, image/png"
           (change)="handleFileInput($event)"
           style="display: none;">

    <!-- Document Label -->
    <div class="document-label">
        {{ documentLabel }}
    </div>
</div>
