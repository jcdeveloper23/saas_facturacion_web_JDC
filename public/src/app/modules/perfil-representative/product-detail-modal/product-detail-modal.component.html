<div style="overflow-y: auto;" class="modal  fade  p-0  " data-backdrop="static" id="myModal" tabindex="-1" role="dialog"
  aria-labelledby="ModalLabel" aria-hidden="true">
  <div class="modal-dialog pt-modal" style="min-width: 80% !important;">
    <div class="modal-content w-100">

      <div class="modal-body p-0">
        <div class="row m-0 align-items-center justify-content-end pr-2 pb-2 pt-2">
          <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)='closemodal()'>
            <i class="nc-icon nc-simple-remove"></i> 
          </button>
        </div>
        <div class="row m-0 w-100" *ngIf="product">
          <div class="col-sm-3">
           
            <div class="col-sm-12 pl-0 text-center">
              <h4 class="c-gray  mb-0 font-bold">{{product.product_name}}</h4>
            </div>
            <div class="col-sm-12 background-image-product p-0 "
              style="background-image: url({{product.product_images[0]}});">
            </div>
            <div class="col-sm-12 p-0 text-center" *ngIf="isCategoryMenu">
              <span class="text-info font-bold" *ngFor="let day of product.product_days_of_availability , let i = index">
                  {{array_week[day]}}<span *ngIf=" product.product_days_of_availability.length - i > 1"> , </span>
                  <span *ngIf="product.product_days_of_availability.length - i === 1">.</span></span> 
          </div>
            <div class="col-sm-12  pl-0 d-flex justify-content-center align-items-center text-center">
              <h4 class="title-product text-warning mb-0">{{product.product_price |
                currency}}</h4>
            </div>
            

          </div>
          <div class="col-sm-3  display-col-center">
              <span class='span-text-description'>{{product.product_description}}</span>

          </div>
          <div class="col-sm-3  display-col-center">
            <div class="row p-0 text-center">
              <span class='span-text-description font-bold'>Fecha de entrega</span>
            </div>
            <div class="col display-col-center p-0">
              <div class="form-group">
                <input [disabled]="isCategoryMenu" id='date' min="{{minDate}}" [(ngModel)]="daySelected"class="form-control cursor-pointer"
                  placeholder="Fecha de entrega" name="date" ngbDatepicker #d="ngbDatepicker" (click)="d.toggle()"
                  (ngModelChange)="onDateSelected()">
              </div>
            </div>

          </div>
          <div class="col-sm-3 display-col-center">
            <div class="row p-0 text-center">
              <span class='span-text-description font-bold'>Modalidad de entrega</span>
            </div>
            <div class="col p-0 display-col-center">
              <div class="form-check-radio ">
                <div class="col-sm-12 mt-2 ">
                  <label class="form-check-label cursor-pointer c-gray ">
                    <input  [(ngModel)]="product.product_delivery_method" class="from-control form-check-input " type="radio" name="exampleRadioz" id="exampleRadios11"
                    value="delivery"> Entrega al aula
                    <span class="form-check-sign"></span>
                  </label>
                </div>
                <hr>
                <div class="col-sm-12 mt-2">
                  <label class="form-check-label cursor-pointer c-gray ">
                    <input   [(ngModel)]="product.product_delivery_method" class="form-check-input " type="radio" name="exampleRadioz" id="exampleRadios12"
                    value="i withdraw"> Para retirar
                    <span class="form-check-sign"></span>
                  </label>
                </div>
              </div>

            </div>

          </div>
        </div>
        <hr>
        <div class="row align-items-center justify-content-center">
          <div class="col-sm-4">
            <button (click)="addToCart()" class="btn btn-primary btn-sm w-100 cursor-pointer">
              <i class="nc-icon nc-cart-simple"></i> &nbsp; Agregar</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
