<!--<c-header class="mb-4 d-print-none" position="sticky">-->
<ng-container>
  <c-container [fluid]="true" class="border-bottom px-4">
    <button [cSidebarToggle]="sidebarId()" cHeaderToggler class="btn" toggle="visible"
      style="margin-inline-start: -14px;" aria-label="Toggle sidebar navigation">
      <svg cIcon name="cil-menu" size="lg"></svg>
    </button>
    <c-header-nav class="d-none d-md-flex">
      <c-nav-item>
        <a cNavLink routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      </c-nav-item>
      <c-nav-item>
        <a cNavLink routerLink="/users" routerLinkActive="active">Users</a>
      </c-nav-item>
      <c-nav-item>
        <a cNavLink routerLink="/settings" routerLinkActive="active">Settings</a>
      </c-nav-item>
    </c-header-nav>

    <c-header-nav class="d-none d-md-flex ms-auto ">
      <a cNavLink>
        <svg cIcon class="my-1" name="cil-bell" size="lg"></svg>
      </a>
      <a cNavLink>
        <svg cIcon class="my-1" name="cil-list" size="lg"></svg>
      </a>
      <a cNavLink>
        <svg cIcon class="my-1" name="cil-envelope-open" size="lg"></svg>
      </a>
    </c-header-nav>

    <c-header-nav class="ms-auto ms-md-0">
      <div class="nav-item py-1">
        <div class="vr h-100 mx-2 text-body text-opacity-75"></div>
      </div>
      <ng-container *ngTemplateOutlet="themeDropdown" />
      <div class="nav-item py-1">
        <div class="vr h-100 mx-2 text-body text-opacity-75"></div>
      </div>
    </c-header-nav>

    <c-header-nav class="mx-0">
      <ng-container *ngTemplateOutlet="userDropdown" />
    </c-header-nav>

  </c-container>
  <c-container [fluid]="true" class="px-4">
    <c-breadcrumb-router />
  </c-container>
</ng-container>
<!--</c-header>-->

<ng-template #userDropdown>
  <c-dropdown [popperOptions]="{ placement: 'bottom-start' }" variant="nav-item">
    <button [caret]="false" cDropdownToggle class="py-0 pe-0" aria-label="Open user menu">
      <c-avatar shape="rounded-1" size="md" [textColor]="'primary'" status="success">
        {{ getUserInitials() }}
      </c-avatar>
    </button>
    <ul cDropdownMenu class="pt-0 w-auto" style="min-width: 220px;">
      <!-- Header con info del usuario -->
      <li>
        <div class="px-3 py-2 bg-body-secondary rounded-top">
          <div class="fw-semibold">{{ currentUser()?.displayName || 'Usuario' }}</div>
          <small class="text-body-secondary">{{ currentUser()?.email }}</small>
          @if (currentUser()?.role) {
          <div>
            <c-badge color="info" class="mt-1">{{ currentUser()?.role }}</c-badge>
          </div>
          }
        </div>
      </li>
      <li>
        <hr cDropdownDivider class="my-0" />
      </li>
      <!-- Opciones de menú -->
      <li>
        <a cDropdownItem routerLink="/profile">
          <svg cIcon class="me-2" name="cil-user"></svg>
          Mi Perfil
        </a>
      </li>
      <li>
        <a cDropdownItem routerLink="/settings">
          <svg cIcon class="me-2" name="cil-settings"></svg>
          Configuración
        </a>
      </li>
      <li>
        <hr cDropdownDivider />
      </li>
      <li>
        <a cDropdownItem (click)="logout()" style="cursor: pointer;" class="text-danger">
          <svg cIcon class="me-2" name="cil-account-logout"></svg>
          Cerrar Sesión
        </a>
      </li>
    </ul>
  </c-dropdown>
</ng-template>

<ng-template #themeDropdown>
  <c-dropdown alignment="end" variant="nav-item">
    <button [caret]="false" cDropdownToggle aria-label="Open theme picker">
      <svg cIcon [name]="icons()" size="lg"></svg>
    </button>
    <div cDropdownMenu>
      @for (mode of colorModes; track mode.name) {
      <button (click)="colorMode.set(mode.name)" [active]="colorMode()===mode.name" cDropdownItem
        class="d-flex align-items-center">
        <svg cIcon class="me-2" [name]="mode.icon" size="lg"></svg>
        {{ mode.text }}
      </button>
      }
    </div>
  </c-dropdown>
</ng-template>
