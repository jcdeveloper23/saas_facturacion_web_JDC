<c-row>
  <c-col>

          <div>
            <strong>Gestión de Usuarios</strong>
            <p class="text-muted mb-0 small">Administra los usuarios de tu organización</p>
          </div>

      </c-card-header>
      <c-card-body>
        <p class="text-muted">Módulo de usuarios en desarrollo...</p>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
