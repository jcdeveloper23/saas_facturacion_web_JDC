<c-modal [visible]="visible" (visibleChange)="onVisibleChange($event)"
         alignment="center" size="sm" backdrop="static">

  <c-modal-header>
    <h5 cModalTitle class="fw-semibold">
      <svg cIcon name="cilTags" size="sm" class="me-1"></svg> Descuento global
    </h5>
    <button class="pos-modal-close" type="button" aria-label="Cerrar" (click)="cancelled.emit()"><svg cIcon name="cilX"></svg></button>
  </c-modal-header>

  <c-modal-body>
    <div class="pdm-input-row">
      <input type="number" class="pdm-input"
             [(ngModel)]="discountValue"
             min="0" max="100" step="1"
             inputmode="numeric" autofocus>
      <span class="pdm-pct">%</span>
    </div>
    <div class="pdm-quick">
      @for (q of quickDiscounts; track q) {
        <button class="pdm-chip" [class.active]="discountValue === q" (click)="setQuick(q)">
          {{ q }}%
        </button>
      }
    </div>
  </c-modal-body>

  <c-modal-footer class="d-flex gap-2 pt-0">
    @if (currentDiscount > 0) {
      <button cButton color="light" variant="outline" class="flex-fill" (click)="remove()">
        Quitar descuento
      </button>
    }
    <button cButton color="primary" class="flex-fill" (click)="apply()">
      Aplicar {{ discountValue }}%
    </button>
  </c-modal-footer>

</c-modal>
