<c-modal [visible]="visible" (visibleChange)="onVisibleChange($event)"
         alignment="center" scrollable>

  <c-modal-header>
    <h5 cModalTitle class="fw-semibold">Seleccionar cliente</h5>
    <button cButtonClose (click)="cancelled.emit()"></button>
  </c-modal-header>

  <c-modal-body class="p-0">

    <!-- Búsqueda -->
    <div class="pcs-search">
      <div class="position-relative">
        <input cFormControl type="text"
               placeholder="Buscar por nombre, RUC o cédula..."
               [(ngModel)]="searchQuery"
               (ngModelChange)="onSearch($event)"
               autofocus>
        @if (loading()) {
          <c-spinner size="sm" class="pcs-spinner"/>
        }
      </div>
    </div>

    <!-- Lista de clientes -->
    <div class="pcs-list">

      <!-- Consumidor Final siempre primero -->
      <button class="pcs-item pcs-cf" (click)="selectConsumidorFinal()">
        <div class="pcs-avatar">CF</div>
        <div class="pcs-info">
          <span class="pcs-name">Consumidor Final</span>
          <span class="pcs-tax">9999999999999</span>
        </div>
      </button>

      @for (p of results(); track p.id) {
        <button class="pcs-item" (click)="selectPerson(p)">
          <div class="pcs-avatar">{{ p.name.charAt(0).toUpperCase() }}</div>
          <div class="pcs-info">
            <span class="pcs-name">{{ p.name }}</span>
            <span class="pcs-tax">{{ p.taxIdType }}: {{ p.taxId }}</span>
          </div>
        </button>
      }

      @if (!loading() && results().length === 0 && searchQuery) {
        <div class="pcs-empty">Sin resultados para "{{ searchQuery }}"</div>
      }

    </div>
  </c-modal-body>

</c-modal>
