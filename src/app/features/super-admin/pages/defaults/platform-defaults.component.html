<c-row class="mb-4 align-items-center">
  <c-col>
    <h2 class="mb-0">Config General</h2>
    <p class="text-muted small mb-0">Configuración inicial que se aplica al crear cada nueva empresa</p>
  </c-col>
  <c-col xs="auto">
    <button cButton color="outline-secondary" size="sm" (click)="seedDefaults()" [disabled]="seeding()">
      @if (seeding()) { <c-spinner size="sm" class="me-1"></c-spinner> }
      <svg cIcon name="cilReload" class="me-1"></svg> Inicializar datos de fábrica
    </button>
  </c-col>
</c-row>

@if (loading()) {
  <div class="text-center py-5"><c-spinner color="primary"></c-spinner></div>
} @else {
  <c-card>
    <c-card-header>
      <svg cIcon name="cilSettings" class="me-2"></svg>
      <strong>Configuración General</strong>
    </c-card-header>
    <c-card-body>
      <form [formGroup]="configForm">
        <c-row class="g-3">
          <c-col md="4">
            <label cLabel>País *</label>
            <input cFormControl formControlName="country" placeholder="Ecuador"
                   [class.is-invalid]="hasError('country')">
            @if (hasError('country')) { <div class="invalid-feedback">Requerido</div> }
          </c-col>
          <c-col md="4">
            <label cLabel>Moneda por defecto *</label>
            <input cFormControl formControlName="defaultCurrency" placeholder="USD"
                   [class.is-invalid]="hasError('defaultCurrency')">
            @if (hasError('defaultCurrency')) { <div class="invalid-feedback">Requerido</div> }
          </c-col>
          <c-col md="4">
            <label cLabel>% IVA por defecto *</label>
            <input cFormControl type="number" formControlName="defaultVatRate" min="0" max="100"
                   [class.is-invalid]="hasError('defaultVatRate')">
            @if (hasError('defaultVatRate')) { <div class="invalid-feedback">Requerido, 0-100</div> }
          </c-col>
        </c-row>
        <div class="mt-3 d-flex justify-content-end">
          <button cButton color="primary" (click)="saveConfig()" [disabled]="saving()">
            @if (saving()) { <c-spinner size="sm" class="me-1"></c-spinner> }
            Guardar Configuración
          </button>
        </div>
      </form>
    </c-card-body>
  </c-card>
}
