<c-row>
  <c-col>
    <c-card class="mb-4">

        <div class="d-flex justify-content-between align-items-center">
          <div>
            <strong>Gestión de Dispositivos GPS</strong>
            <p class="text-muted mb-0 small">Administra tus dispositivos de rastreo</p>
          </div>
          <button cButton color="primary" *hasPermission="'devices.create'">
            <svg cIcon name="cil-plus" size="sm"></svg>
            Nuevo Dispositivo
          </button>
        </div>
      </c-card-header>
      <c-card-body>
        <p class="text-muted">Módulo de dispositivos en desarrollo...</p>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
